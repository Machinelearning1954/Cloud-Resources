name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: docker build -t iris-app .
      - name: Smoke-test the container
        run: |
          docker run -d --name iris -p 5000:5000 iris-app
          for i in $(seq 1 30); do curl -sf localhost:5000/health && break; sleep 1; done
          curl -sf localhost:5000/health
          curl -sf -X POST localhost:5000/predict -H 'Content-Type: application/json' \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' | grep -q setosa
          docker logs iris

  neon-harbor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy doctor (26 checks)
        run: bash neon-harbor/tools/repo_doctor.sh
      - name: Engine config static check
        run: python3 neon-harbor/tools/check_engine_config.py
      - name: Multiplayer net budget check
        run: python3 neon-harbor/tools/check_net_budget.py
      - name: Red-team scan and attack suite
        run: python3 neon-harbor/tools/red_team.py
