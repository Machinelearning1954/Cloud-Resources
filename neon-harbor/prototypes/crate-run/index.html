<title>Crate Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Crate Run: a prototype of ONE mechanic for Neon Harbor: Kingston (see brief.md).
  One self-contained file: no network, no assets, no libraries. Opens by double-click.
  Throwaway prototype code. It is not the game and is never imported by game code.
-->
<style>
  /* Layout: one full-screen canvas; a thin status bar on top; touch controls bottom-right. */
  :root {
    --night: #0b1420; --panel: #132233; --line: #2b4460; --ink: #f3ead8; --dim: #9fb3c8;
    --zinc: #9fb0b8; --sodium: #ff9d3c; --sea: #1f6f86; --heat: #ff4d5e; --go: #3ed6a4;
    --display: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body);
         overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at center, rgba(4,8,18,0) 62%, rgba(4,8,18,.24) 100%); }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: center;
         padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px));
         padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: linear-gradient(var(--night), transparent); font-variant-numeric: tabular-nums; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
          font-size: 13px; white-space: nowrap; }
  .chip b { font-family: var(--display); font-size: 16px; letter-spacing: .5px; }
  #heatlabel { font-size: 12px; color: var(--dim); }
  #heatwrap { flex: 1 1 60px; min-width: 36px; max-width: 260px; height: 14px; background: var(--panel);
              border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  #heat { height: 100%; width: 0%; background: var(--heat); }
  .ctl { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
         font: 600 13px var(--body); padding: 6px 10px; cursor: pointer; white-space: nowrap; margin-left: auto; }
  .ctl + .ctl { margin-left: 0; }
  #hud { flex-wrap: nowrap; gap: 8px; }
  @media (max-width: 480px) {
    #hud { gap: 6px; } #heatlabel, .pm { display: none; }
    .chip { padding: 3px 6px; font-size: 12px; } .chip b { font-size: 15px; } .ctl { padding: 5px 7px; font-size: 12px; }
  }
  .ctl:focus-visible, .big:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
  #drop { position: absolute; right: max(16px, env(safe-area-inset-right, 0px));
          bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%;
          background: var(--panel); color: var(--ink); border: 2px solid var(--sodium);
          font: 700 15px var(--display); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  #drop:disabled { opacity: .35; border-color: var(--line); }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: 54px; max-width: min(92%, 520px);
           background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
           font-size: 14px; text-align: center; z-index: 5; }
  #toast.low { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          background: rgba(6, 12, 20, .78); padding-block: 16px;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #card .box { width: min(100%, 460px); max-height: 100%; overflow: auto; background: var(--panel);
               border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  #card h1 { margin: 0 0 4px; font: 700 34px/1 var(--display); letter-spacing: 1px; text-transform: uppercase;
             text-wrap: balance; }
  #card h1 span { color: var(--sodium); }
  #card p { margin: 8px 0; font-size: 14px; line-height: 1.45; color: var(--ink); }
  #card .sub { color: var(--dim); font-size: 13px; }
  #card ul { margin: 8px 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .big { background: var(--sodium); color: #1b1206; border: 0; border-radius: 6px; padding: 10px 16px;
         font: 700 16px var(--display); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .big.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; margin-top: 8px; }
  .key { height: 44px; background: var(--night); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
         font: 600 12px var(--body); cursor: pointer; }
  .key:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
  #code { font: 700 18px var(--display); letter-spacing: 4px; min-height: 24px; color: var(--sodium); }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <span class="chip"><b id="clock">4:00</b><span class="pm"> PM</span></span>
    <span class="chip">Crates <b id="crates">0/5</b></span>
    <span id="heatlabel">Heat</span>
    <div id="heatwrap" role="meter" aria-label="Heat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="heat"></div></div>
    <button class="ctl" id="mute" type="button" aria-pressed="false">Sound</button>
    <button class="ctl" id="pause" type="button">Pause</button>
  </div>
  <div id="toast" hidden></div>
  <button id="drop" type="button" hidden disabled>Drop</button>
  <div id="card"><div class="box" id="box"></div></div>
</div>

<script>
"use strict";
/* ---------------- tuning: every number the game uses lives here ---------------- */
const config = {
  walkSpeed:    { value: 150, min: 80,  max: 260, step: 5 },    // px/s, empty-handed
  carrySpeed:   { value: 115, min: 60,  max: 220, step: 5 },    // px/s, carrying a crate
  cratesToWin:  { value: 5,   min: 1,   max: 8,   step: 1 },
  clockSeconds: { value: 210, min: 60,  max: 600, step: 10 },   // real seconds for 4 PM -> 7 PM
  heatRise:     { value: 34,  min: 5,   max: 100, step: 1 },    // heat per second while seen carrying
  heatFall:     { value: 4,   min: 0,   max: 30,  step: 1 },    // heat per second while unseen
  seeRange:     { value: 230, min: 80,  max: 500, step: 10 },   // patrol vision distance, px
  seeHalfAngle: { value: 32,  min: 10,  max: 80,  step: 1 },    // degrees either side of facing
  patrolSpeed:  { value: 95,  min: 30,  max: 220, step: 5 },    // px/s for the first patrol
  patrolRamp:   { value: 7,   min: 0,   max: 40,  step: 1 },    // extra px/s per crate delivered
  maxPatrols:   { value: 5,   min: 1,   max: 5,   step: 1 },
  pickRadius:   { value: 34,  min: 16,  max: 80,  step: 2 },
  slowSeconds:  { value: 30,  min: 5,   max: 120, step: 5 },    // how long the Slow Riddim code lasts
  bonusSeconds: { value: 30,  min: 5,   max: 120, step: 5 },    // clock time the Late Doors code gives back
};
const tune = new Proxy({}, { get: (_, k) => config[k].value });

/* ---------------- world: one Kingston block, in world pixels ---------------- */
const W = 1200, H = 1600, QUAY = 1380, WATER = 1470, STEP = 1 / 60;
const ROOF = ["#8fa3ad", "#a39a8b", "#7f9a8f", "#a98f7a", "#8c93a8", "#9aa58a"];
const WALL = ["#d8c9a8", "#c9d6cf", "#e2b98f", "#b9c4d6", "#d6c2c0"]; // painted block walls
const B = [ // buildings: x, y, w, h (zinc-roofed yards and shops; gaps between them are alleys)
  [40,40,260,150],[40,230,110,150],[190,230,110,150],
  [380,40,200,340],[620,40,200,160],[620,240,200,140],
  [900,40,260,150],
  [40,460,260,200],[40,700,120,200],[200,700,100,200],
  [380,460,200,200],[620,460,200,200],[380,700,440,200],
  [900,460,260,130],[900,630,110,270],[1050,630,110,270],
  [40,980,260,140],[40,1160,260,140],
  [380,980,200,320],[620,980,200,150],[620,1170,200,130],
  [900,980,260,140],[900,1160,260,140],
  [40,1392,170,66],
].map(([x, y, w, h], i) => ({ x, y, w, h, c: ROOF[i % ROOF.length], tall: 1 + (i * 37 % 10) / 14, wall: WALL[i % WALL.length] }));
const SOUNDHALL = B[6], BOATWORKS = B[23];
const PICK = { x: 300, y: 1425 }, DROP = { x: 1030, y: 290 };
const LAMPS = [[340,420],[860,420],[340,940],[860,940],[340,1340],[860,1340],[600,420],[600,940],[600,1340],[1030,330]];
const ROUTES = [ // patrol loops along the street centre lines; `foot` walks instead of drives
  { pts: [[340,420],[860,420],[860,940],[340,940]] },
  { pts: [[860,940],[860,1340],[340,1340],[340,940]] },
  { pts: [[860,420],[340,420],[340,1340],[860,1340]] },
  { pts: [[120,1340],[1100,1340]], foot: true },
  { pts: [[860,940],[340,940],[340,420],[860,420]] },
];
const CAST = [ // every figure, drawn in code; hair ids are from the project's hair library
  { name: "Imani Vassell",      hair: "locs-updo", skin: "#7a4a2b", shirt: "#e8b23a", note: "you" },
  { name: "Omari 'Bassline' Grant", hair: "locs-freeform", skin: "#5c3620", shirt: "#3aa0c8", note: "sound engineer" },
  { name: "Nadine 'Brass' Whyte",   hair: "locs-wrap", skin: "#6b4026", shirt: "#c8573a", note: "boatwright" },
  { name: "Passer-by",          hair: "waves", skin: "#6a3f25", shirt: "#7fbf6a", note: "360 waves" },
  { name: "Passer-by",          hair: "afro", skin: "#8a5a36", shirt: "#b07ad0", note: "rounded afro" },
  { name: "Passer-by",          hair: "canerows", skin: "#54311c", shirt: "#e07a9a", note: "canerows" },
  { name: "Foot patrol",        hair: "cap", skin: "#7a4a2b", shirt: "#2c3f66", note: "sees you carrying" },
];

// Demo cheat codes for this prototype only (ADR 0058): six directions, entered on the pause pad.
const CODES = [
  { seq: "UUDLRD", name: "Clean Slate", does: "heat cleared",            run: () => { S.heat = 0; } },
  { seq: "LRLRDD", name: "Slow Riddim", does: "patrols at half speed",   run: () => { S.slowUntil = S.t + tune.slowSeconds; } },
  { seq: "DDURLU", name: "Late Doors",  does: "clock wound back",        run: () => { S.t = Math.max(0, S.t - tune.bonusSeconds); S.slowUntil = Math.max(0, S.slowUntil - tune.bonusSeconds); } },
];
let typed = "";
function enterCode(d) {
  if (scene !== "pause") return;
  typed = (typed + d).slice(-6);
  const hit = CODES.find((c) => c.seq === typed);
  const el = document.getElementById("code"), msg = document.getElementById("codemsg");
  if (hit) { hit.run(); S.cheated = true; typed = ""; if (msg) msg.textContent = `${hit.name}: ${hit.does}. This run no longer counts.`; }
  if (el) el.textContent = typed.split("").join(" ");
}

/* ---------------- deterministic helpers ---------------- */
let seed = 20261114;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segHitsRect(x1, y1, x2, y2, r) { // does the sight line cross a building?
  let t0 = 0, t1 = 1; const dx = x2 - x1, dy = y2 - y1;
  for (const [p, q] of [[-dx, x1 - r.x], [dx, r.x + r.w - x1], [-dy, y1 - r.y], [dy, r.y + r.h - y1]]) {
    if (p === 0) { if (q < 0) return false; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; }
  }
  return true;
}
const clearSight = (a, b) => !B.some((r) => segHitsRect(a.x, a.y, b.x, b.y, r));
function blocked(x, y, rad) {
  if (x < rad || x > W - rad || y < rad || y > WATER - rad) return true;
  return B.some((r) => x > r.x - rad && x < r.x + r.w + rad && y > r.y - rad && y < r.y + r.h + rad);
}

/* ---------------- state ---------------- */
let S, scene = "title", keys = {}, stick = null, muted = false, lastToast = "";
function newPatrol(i) {
  const r = ROUTES[i % ROUTES.length];
  return { route: r, foot: !!r.foot, leg: 0, dir: 1, x: r.pts[0][0], y: r.pts[0][1], ang: 0, sees: false };
}
function reset() {
  seed = 20261114;
  S = { t: 0, heat: 0, delivered: 0, carrying: false, stash: null, cool: 0, seen: false, result: "", cheated: false, slowUntil: 0,
        player: { x: 240, y: 1425, ang: -Math.PI / 2, walk: 0 },
        patrols: [newPatrol(0)],
        peds: Array.from({ length: 8 }, (_, i) => {
          const l = LAMPS[Math.floor(rnd() * 9)];
          return { x: l[0] + 28, y: l[1] + 28, tx: l[0] + 28, ty: l[1] + 28, ang: 0, walk: 0, cast: CAST[3 + i % 3], sp: 40 + rnd() * 25 };
        }) };
}

/* ---------------- one fixed step of game logic ---------------- */
function input() {
  let x = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  let y = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  if (stick) { x += stick.x; y += stick.y; }
  const m = Math.hypot(x, y); return m > 1 ? { x: x / m, y: y / m } : { x, y };
}
function toggleCrate() {
  if (scene !== "play") return;
  if (S.carrying) { S.carrying = false; S.stash = { x: S.player.x, y: S.player.y, armed: false }; say("Crate down. Patrols ignore you now. Come back for it."); }
  else if (S.stash && dist(S.player, S.stash) < tune.pickRadius + 10) { S.carrying = true; S.stash = null; }
}
function step() {
  if (scene !== "play") return;
  const p = S.player, v = input(), sp = S.carrying ? tune.carrySpeed : tune.walkSpeed;
  S.t += STEP; S.cool = Math.max(0, S.cool - STEP);
  const nx = p.x + v.x * sp * STEP, ny = p.y + v.y * sp * STEP;
  if (!blocked(nx, p.y, 11)) p.x = nx;
  if (!blocked(p.x, ny, 11)) p.y = ny;
  if (v.x || v.y) { p.ang = Math.atan2(v.y, v.x); p.walk += STEP * sp / 14; }

  // pick up, recover a stashed crate, deliver
  if (!S.carrying && !S.stash && dist(p, PICK) < tune.pickRadius) { S.carrying = true; say(S.delivered ? "" : "Follow the arrow to Zinc Roof Soundhall."); }
  // a crate you put down stays down until you walk away and come back (or press Pick up)
  if (S.stash && !S.stash.armed && dist(p, S.stash) > tune.pickRadius + 6) S.stash.armed = true;
  if (!S.carrying && S.stash && S.stash.armed && dist(p, S.stash) < tune.pickRadius - 12) { S.carrying = true; S.stash = null; }
  if (S.carrying && dist(p, DROP) < tune.pickRadius + 14) {
    S.carrying = false; S.delivered++; beat.layers = S.delivered;
    while (S.patrols.length < Math.min(tune.maxPatrols, 1 + S.delivered)) S.patrols.push(newPatrol(S.patrols.length));
    say(S.delivered === 1 ? "One in. Each crate brings another patrol. Alleys hide you." : `${S.delivered} of ${tune.cratesToWin} delivered.`);
    if (S.delivered >= tune.cratesToWin) return end("won");
  }

  // patrols follow their loops and look ahead
  const cosHalf = Math.cos(tune.seeHalfAngle * Math.PI / 180); S.seen = false;
  for (const g of S.patrols) {
    const pts = g.route.pts, speed = (tune.patrolSpeed + tune.patrolRamp * S.delivered) * (g.foot ? 0.55 : 1) * (S.t < S.slowUntil ? 0.5 : 1);
    let next = g.foot ? g.leg + g.dir : (g.leg + 1) % pts.length;
    if (g.foot && (next < 0 || next >= pts.length)) { g.dir = -g.dir; next = g.leg + g.dir; }
    const tx = pts[next][0], ty = pts[next][1], d = Math.hypot(tx - g.x, ty - g.y);
    if (d < speed * STEP) { g.x = tx; g.y = ty; g.leg = next; }
    else { g.x += (tx - g.x) / d * speed * STEP; g.y += (ty - g.y) / d * speed * STEP; g.ang = Math.atan2(ty - g.y, tx - g.x); }
    const dx = p.x - g.x, dy = p.y - g.y, dd = Math.hypot(dx, dy);
    g.sees = S.carrying && dd < tune.seeRange && dd > 0 &&
             (dx * Math.cos(g.ang) + dy * Math.sin(g.ang)) / dd > cosHalf && clearSight(g, p);
    if (g.sees) S.seen = true;
  }
  S.heat = clamp(S.heat + (S.seen ? tune.heatRise : -tune.heatFall) * STEP, 0, 100);
  if (S.seen && lastToast.indexOf("Seen") !== 0) say("Seen carrying! Break the sight line or drop the crate.");

  // ambient passers-by: decoration only
  for (const q of S.peds) {
    const d = Math.hypot(q.tx - q.x, q.ty - q.y);
    if (d < 3) { const l = LAMPS[Math.floor(rnd() * 9)], m = LAMPS[Math.floor(rnd() * 9)];
      if (rnd() < 0.5) { q.tx = l[0] + 28; q.ty = q.y; } else { q.ty = m[1] + 28; q.tx = q.x; } }
    else { q.x += (q.tx - q.x) / d * q.sp * STEP; q.y += (q.ty - q.y) / d * q.sp * STEP; q.ang = Math.atan2(q.ty - q.y, q.tx - q.x); q.walk += STEP * 4; }
  }
  if (S.heat >= 100) return end("lost-heat");
  if (S.t >= tune.clockSeconds) return end("lost-time");
}
function end(result) { S.result = result; scene = result === "won" ? "won" : "lost"; showCard(); }

/* ---------------- drawing: every figure is drawn here, in code ---------------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let vw = 0, vh = 0, scale = 1, dpr = 1;
// Dynamic resolution: if this device is really drawing slowly, draw fewer pixels. Frame rate
// comes first and sharpness gives way (ADR 0050). A fast device never loses any sharpness.
let quality = 1, slowFrames = 0, countedFrames = 0;
function tally(ms) { // called once per real frame with the time since the last one
  if (ms <= 0 || ms > 250) return;                    // ignore tab switches and the first frame
  countedFrames++; if (ms > 24) slowFrames++;
  if (countedFrames < 90) return;
  if (slowFrames > 45 && quality > 0.5) { quality -= 0.25; fit(); }
  countedFrames = 0; slowFrames = 0;
}
function fit() {
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2) * quality); vw = cv.clientWidth; vh = cv.clientHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr); scale = clamp(Math.min(vw, vh) / 560, 0.6, 1.6);
}
function hair(c, kind) {
  c.fillStyle = "#1a1210"; c.strokeStyle = "#1a1210"; c.lineCap = "round";
  if (kind === "locs-updo") { // locs pinned up in a crown, bun at the back
    for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283; c.beginPath(); c.arc(Math.cos(a) * 6.2, Math.sin(a) * 6.2, 2.3, 0, 6.3); c.fill(); }
    c.beginPath(); c.arc(-5.5, 0, 4.6, 0, 6.3); c.fill();
  } else if (kind === "locs-freeform") { // uneven locs falling to the shoulders
    c.beginPath(); c.arc(0, 0, 7.4, 0, 6.3); c.fill(); c.lineWidth = 2.6;
    for (let i = 0; i < 11; i++) { const a = 1.2 + i / 11 * 3.9, l = 11 + (i * 7 % 5); c.beginPath(); c.moveTo(Math.cos(a) * 5, Math.sin(a) * 5); c.lineTo(Math.cos(a) * l, Math.sin(a) * l); c.stroke(); }
  } else if (kind === "locs-wrap") { // long locs under a head wrap
    c.lineWidth = 2.6;
    for (let i = 0; i < 7; i++) { const yy = -6 + i * 2; c.beginPath(); c.moveTo(-4, yy); c.lineTo(-17 + Math.abs(yy) * 0.5, yy * 1.3); c.stroke(); }
    c.fillStyle = "#d9553b"; c.beginPath(); c.arc(0, 0, 8, 0, 6.3); c.fill();
    c.strokeStyle = "#f2c14e"; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, 5, 0.6, 5.7); c.stroke();
  } else if (kind === "waves") { // 360 waves: rings brushed out from the crown
    c.beginPath(); c.arc(0, 0, 7.2, 0, 6.3); c.fill(); c.strokeStyle = "#4a3a34"; c.lineWidth = 0.9;
    for (let r = 1.6; r < 7; r += 1.7) { c.beginPath(); c.arc(-0.6, 0, r, 0, 6.3); c.stroke(); }
  } else if (kind === "afro") { // rounded afro with a soft scalloped edge
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; c.beginPath(); c.arc(Math.cos(a) * 8.2, Math.sin(a) * 8.2, 3.4, 0, 6.3); c.fill(); }
    c.beginPath(); c.arc(0, 0, 9.4, 0, 6.3); c.fill();
  } else if (kind === "canerows") { // rows braided front to back
    c.beginPath(); c.arc(0, 0, 7.2, 0, 6.3); c.fill(); c.strokeStyle = "#6a4a3a"; c.lineWidth = 1;

    if (L >= 4 && [0, 6, 10].includes(s)) tone("sawtooth", [440, 523.3, 392][[0, 6, 10].indexOf(s)], t, 0.3, 0.03); // lead
    beat.next += spb; beat.i++;
  }
}

/* ---------------- screens, HUD and input ---------------- */
const $ = (id) => document.getElementById(id);
function say(msg) { lastToast = msg; $("toast").textContent = msg; $("toast").hidden = !msg; say.until = S ? S.t + 4.5 : 0; }
function hud() {
  const playing = scene === "play"; $("toast").classList.toggle("low", !playing); $("toast").hidden = !lastToast || !(playing || scene === "figures"); $("hud").hidden = scene === "title" || scene === "figures"; $("drop").hidden = !playing;
  if (!S) return;
  const mins = Math.floor(clamp(S.t / tune.clockSeconds, 0, 1) * 180);
  $("clock").textContent = `${4 + Math.floor(mins / 60)}:${String(mins % 60).padStart(2, "0")}`;
  $("crates").textContent = `${S.delivered}/${tune.cratesToWin}`;
  $("heat").style.width = S.heat + "%"; $("heatwrap").setAttribute("aria-valuenow", String(Math.round(S.heat)));
  const near = S.stash && dist(S.player, S.stash) < tune.pickRadius + 10;
  $("drop").disabled = !(S.carrying || near); $("drop").textContent = S.carrying ? "Drop" : "Pick up";
  if (lastToast && S.t > say.until) say("");
}
function showCard() {
  const box = $("box"); $("card").hidden = scene === "play"; if (scene === "play") return;
  const btn = (id, label, alt) => `<button class="big${alt ? " alt" : ""}" id="${id}" type="button">${label}</button>`;
  if (scene === "title") box.innerHTML = `<h1>Crate <span>Run</span></h1>
    <p class="sub">A one-block prototype for Neon Harbor: Kingston. Not the game.</p>
    <p>Doors open at 7:00 PM. Carry <b>5 speaker crates</b> from Keelwright Boatworks to Zinc Roof Soundhall.</p>
    <ul><li>Patrols only care while you are <b>carrying</b>.</li><li>Put the crate down to walk past clean, then come back for it.</li><li>Alleys block their view.</li></ul>
    <p class="sub">Phone: drag anywhere to move, tap Drop. Keyboard: arrows or WASD, Space to drop or pick up, P pause, M sound.</p>
    <div class="row">${btn("go", "Start")}${btn("cast", "Cast", true)}</div>`;
  else if (scene === "figures") box.innerHTML = "";
  else if (scene === "pause") box.innerHTML = `<h1>Paused</h1><div class="row">${btn("go", "Resume")}${btn("again", "Restart", true)}</div>
    <p class="sub">Codes: tap six directions (or use the arrow keys). Try Up Up Down Left Right Down.</p>
    <div id="code"></div><p class="sub" id="codemsg" role="status"></p>
    <div class="pad"><span></span><button class="key" data-d="U" type="button">Up</button><span></span>
      <button class="key" data-d="L" type="button">Left</button><button class="key" data-d="D" type="button">Down</button><button class="key" data-d="R" type="button">Right</button></div>`;
  else if (scene === "won") box.innerHTML = `<h1>Doors <span>open</span></h1><p>All ${tune.cratesToWin} crates are stacked with ${Math.max(0, Math.round((tune.clockSeconds - S.t) / tune.clockSeconds * 180))} minutes to spare, heat at ${Math.round(S.heat)}.</p>${S.cheated ? '<p class="sub">Codes were used, so this run does not count.</p>' : ''}<div class="row">${btn("again", "Play again")}</div>`;
  else box.innerHTML = `<h1>${S.result === "lost-heat" ? "Too much <span>heat</span>" : "Doors <span>stayed shut</span>"}</h1>
    <p>${S.result === "lost-heat" ? "A patrol watched you carry for too long." : "Seven o'clock came with the stack unfinished."} You delivered ${S.delivered} of ${tune.cratesToWin}.</p>${S.cheated ? '<p class="sub">Codes were used on this run.</p>' : ''}<div class="row">${btn("again", "Try again")}</div>`;
  if (scene === "figures") { $("card").hidden = true; $("hud").hidden = true; say("Tap or press any key to go back"); return; }
  const go = $("go"), again = $("again"), cast = $("cast"); typed = "";
  for (const k of box.querySelectorAll(".key")) k.onclick = () => enterCode(k.dataset.d);
  if (go) go.onclick = () => { if (scene === "title") reset(); scene = "play"; sound(); showCard(); say(S.t ? "" : "Walk into the crate pile to pick one up."); };
  if (again) again.onclick = () => { reset(); beat.layers = 0; scene = "play"; sound(); showCard(); say("Walk into the crate pile to pick one up."); };
  if (cast) cast.onclick = () => { scene = "figures"; showCard(); };
  (go || again).focus();
}
function sound() { if (!beat.ac) { try { beat.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { beat.ac = null; } } if (beat.ac && beat.ac.state === "suspended") beat.ac.resume(); }
function pause() { if (scene === "play") { scene = "pause"; showCard(); } else if (scene === "pause") { scene = "play"; showCard(); } }
function setMute() { muted = !muted; $("mute").textContent = muted ? "Muted" : "Sound"; $("mute").setAttribute("aria-pressed", String(muted)); }
function leaveFigures() { if (scene === "figures") { scene = "title"; say(""); showCard(); return true; } return false; }
function press(k) {
  if (leaveFigures()) return;
  if (scene === "pause" && k.indexOf("Arrow") === 0) return enterCode(k[5]);
  if (k === " " || k === "Space") toggleCrate(); else if (k === "p" || k === "Escape") pause(); else if (k === "m") setMute();
  else if (k === "Enter" && scene !== "play") { const b = $("go") || $("again"); if (b) b.click(); }
}
addEventListener("keydown", (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) e.preventDefault();
  if (scene === "play" && k === " ") { if (!e.repeat) toggleCrate(); keys[k] = true; return; } // even with a button focused
  if (!e.repeat && e.target.tagName !== "BUTTON" || k !== "Enter" && k !== " " && !e.repeat) { if (!keys[k]) press(k); } keys[k] = true; });
addEventListener("keyup", (e) => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
addEventListener("blur", () => { keys = {}; stick = null; });
cv.addEventListener("pointerdown", (e) => { if (leaveFigures()) return; if (scene !== "play") return; cv.setPointerCapture(e.pointerId); stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0 }; });
cv.addEventListener("pointermove", (e) => { if (!stick || e.pointerId !== stick.id) return; const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, m = Math.hypot(dx, dy), k = Math.min(1, m / 44); stick.x = m ? dx / m * k : 0; stick.y = m ? dy / m * k : 0; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (stick && e.pointerId === stick.id) stick = null; });
$("drop").onclick = () => { toggleCrate(); $("drop").blur(); }; $("pause").onclick = pause; $("mute").onclick = () => { setMute(); $("mute").blur(); };
addEventListener("resize", fit);

/* ---------------- loop: logic runs on a fixed step, never on the wall clock ---------------- */
let acc = 0, last = 0, manual = false;
function frame(now) {
  if (!manual) { acc += Math.min(0.1, (now - last) / 1000 || 0); while (acc >= STEP) { step(); acc -= STEP; } if (scene === "play" && last) tally(now - last); }
  last = now; audio(); hud(); draw(); requestAnimationFrame(frame);
}
// check hooks: let a script drive the game and read its state
window.game = {
  get scene() { return scene; }, get state() { return S; }, config,
  get quality() { return quality; }, frameTime(ms, n) { for (let i = 0; i < (n || 1); i++) tally(ms); },
  press(k) { press(k); }, hold(k, on) { keys[k] = on !== false; },
  step(n) { manual = true; for (let i = 0; i < (n || 1); i++) step(); hud(); draw(); },
  start() { reset(); beat.layers = 0; scene = "play"; showCard(); },
  code(seq) { if (scene === "play") pause(); for (const d of seq) enterCode(d); },
};
reset(); buildLayers(); fit(); showCard(); requestAnimationFrame(frame);
</script>
