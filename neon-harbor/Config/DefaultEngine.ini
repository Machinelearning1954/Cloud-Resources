; Neon Harbor: Kingston - renderer settings (ADR 0050, ledger rows 69-70)
;
; STATUS: NAMES VERIFIED, RENDERING UNTESTED.
; - Every active setting name below was checked against public Unreal sources on
;   2026-11-10 (ledger row 70). tools/check_engine_config.py re-checks this file.
; - No Unreal Editor was available, so nothing here has been seen rendering.
;   This file does nothing until a UE 5.5 project (.uproject) sits next to Config/.
; - After opening the project, confirm in Project Settings > Rendering.

[/Script/Engine.RendererSettings]
; Lumen dynamic global illumination and Lumen reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Hardware ray tracing support, and Lumen using it when the GPU allows
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
; Virtual Shadow Maps
r.Shadow.Virtual.Enable=1
; Nanite virtualised geometry
r.Nanite.ProjectEnabled=True
; Mesh distance fields: software Lumen traces these on GPUs without ray tracing
r.GenerateMeshDistanceFields=True
; Skin cache shaders: needed for ray-traced skinned characters
r.SkinCache.CompileShaders=True
; Anti-aliasing method 4 = Temporal Super Resolution (TSR)
r.AntiAliasingMethod=4

; --- RTX Ultra mode only: off by default (ADR 0050) ---
; MegaLights. Name verified (added in UE 5.5), but the feature is experimental.
;r.MegaLights.EnableForProject=True
; Lumen hit lighting. Name verified; sources disagree on whether the value is
; 1 or 2 for the mode wanted, so choose it in Project Settings (Ray Lighting Mode).
;r.Lumen.HardwareRayTracing.LightingMode=2

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DirectX 12 with Shader Model 6: required for hardware ray tracing and Nanite.
; If the project fails to open on an older PC, remove the SM6 line and retry.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
