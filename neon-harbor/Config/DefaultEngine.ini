; Neon Harbor: Kingston - renderer settings (ADR 0050, ledger row 69)
;
; STATUS: UNTESTED. Written 2026-11-10 without an Unreal Editor. This file does
; nothing until a UE 5.5 project (.uproject) exists next to this Config/ folder.
; After opening the project, confirm each line in Project Settings > Rendering.
;
; The five active lines below match a community-posted working block (ledger
; row 69). Lines starting with ';' are PENDING: their names were not verified
; for UE 5.5 and stay off until checked in the editor.

[/Script/Engine.RendererSettings]
; Lumen dynamic global illumination and Lumen reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Hardware ray tracing support, and Lumen using it when the GPU allows
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
; Virtual Shadow Maps
r.Shadow.Virtual.Enable=1

; --- PENDING: verify the name and value in UE 5.5 before enabling ---
; Nanite geometry (on by default in new UE5 projects)
;r.Nanite.ProjectEnabled=True
; Mesh distance fields (needed by software Lumen on tiers without ray tracing)
;r.GenerateMeshDistanceFields=True
; Skin cache shaders (needed for ray-traced skinned characters)
;r.SkinCache.CompileShaders=True
; Temporal Super Resolution as the anti-aliasing method
;r.AntiAliasingMethod=4
; MegaLights (experimental in UE 5.5) - RTX Ultra mode only
;r.MegaLights.EnableForProject=True
; Lumen hit lighting for reflections - RTX Ultra mode only
;r.Lumen.HardwareRayTracing.LightingMode=2

; --- PENDING: Windows targets for ray tracing (DirectX 12, Shader Model 6) ---
;[/Script/WindowsTargetPlatform.WindowsTargetSettings]
;DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
;+D3D12TargetedShaderFormats=PCD3D_SM6
